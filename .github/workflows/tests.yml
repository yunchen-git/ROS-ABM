name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy networkx cython matplotlib opencv-python vpython pandas torch pillow pytest

      - name: Build Cython extensions
        run: python setup.py build_ext --inplace

      - name: Run tests
        run: pytest -q -rs tests

